<dialog id="queueCleanlinessFormDialog">
    <form id="queueCleanlinessForm" class="p-3" style="min-width: 340px;">
        <h5 class="mb-3">Hospital Queue and Cleanliness Report</h5>

        <!-- Hidden fields -->
        <input type="hidden" id="report_hospital_id">
        <input type="hidden" id="report_hospital_name">
        <input type="hidden" id="report_user_id">

        <div class="mb-2">
            <label class="form-label fw-bold">Hospital Name</label>
            <div id="report_hospital_name_display" class="form-control bg-light"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Queue Length</label>
            <div id="queueLengthOptions">
                <p class="text-muted mb-0">Loading queue options...</p>
            </div>
        </div>

        <div class="mb-3">
            <label for="cleanliness" class="form-label">Please describe the cleanliness of the hospital</label>
            <textarea class="form-control" id="cleanliness" rows="4" placeholder="Type your cleanliness description here"></textarea>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <button type="button"
                    class="btn btn-secondary"
                    onclick="closeDialog(document.getElementById('queueCleanlinessFormDialog'));">
                Cancel
            </button>

            <button type="button"
                    class="btn btn-primary"
                    onclick="saveDialog(document.getElementById('queueCleanlinessFormDialog'));">
                Save Cleanliness/Queue
            </button>
        </div>
    </form>
</dialog>
